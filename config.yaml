# Configuración del auditor de planillas de fauna XPE.
# Todo lo que no esté aquí toma el valor por defecto de auditor/config.py.

transecto:
  largo_min_m: 150
  largo_max_m: 250
  # E10: distancia máxima entre el punto de la estación y el punto medio del transecto
  distancia_max_estacion_a_punto_medio_m: 150

# Ancho de banda del transecto por clase (m). Se usa para calcular el área
# muestreada en base_limpia_larga.csv (área = largo × ancho) y así obtener densidades.
ancho_transecto_m:
  Aves: 50
  Mamíferos: 20
  Reptiles: 4
  Anfibios: 4

coordenadas:
  # E07: coordenada a más de esta distancia de la mediana de las estaciones
  distancia_max_a_mediana_km: 5

captura:
  # R16: coordenada de captura a más de esta distancia de su estación
  distancia_max_m: 300

# R08: especies domésticas. Se marcan siempre; con excluir_del_analisis: true además salen
# con excluir_motivo = 'doméstica' en base_limpia_larga.csv (la fila no se borra).
domesticas:
  excluir_del_analisis: true
  nombres_cientificos:
    - Equus caballus
    - Equus asinus
    - Canis familiaris
    - Canis lupus familiaris
    - Felis catus
    - Felis silvestris catus
    - Bos taurus
    - Capra hircus
    - Ovis aries
    - Gallus gallus
    - Gallus gallus domesticus
  nombres_comunes:
    - Caballo
    - Caballo feral
    - Perro
    - Gato
    - Gato doméstico
    - Vaca
    - Vaca feral
    - Cabra
    - Oveja
    - Burro
    - Gallina

# R25: especies introducidas (exóticas asilvestradas). Se marcan y quedan con
# origen = 'introducida' en base_limpia_larga.csv, pero NO se excluyen: la LdB las reporta.
introducidas:
  nombres_cientificos: [Oryctolagus cuniculus, Lepus europaeus, Rattus rattus, Rattus norvegicus, Mus musculus, Sus scrofa, Neogale vison, Neovison vison, Castor canadensis, Cervus elaphus, Columba livia, Passer domesticus]
  nombres_comunes: [Conejo, Conejo europeo, Liebre, Liebre europea, Rata negra, Guarén, Laucha doméstica, Ratón doméstico, Jabalí, Visón, Castor, Ciervo rojo, Paloma, Paloma doméstica, Gorrión]

aves:
  clase: Aves
  # R11: horario de baja actividad de aves (registros en transecto)
  horario_baja_actividad: ["12:00", "17:00"]
  # R11 se reporta como hallazgo si el % en ese horario supera este umbral
  umbral_pct: 50

horarios:
  # R12: los playback (aves y anfibios) se hacen de noche; solo se marca uno hecho
  # claramente de día, fuera de este rango
  nocturno: ["18:00", "07:00"]
  metodologias_nocturnas: [Playback aves, Playback anfibios]
