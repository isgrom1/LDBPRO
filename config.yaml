# Configuración del auditor de planillas de fauna XPE.
# Todo lo que no esté aquí toma el valor por defecto de auditor/config.py.

transecto:
  largo_min_m: 150
  largo_max_m: 250
  # E10: distancia máxima entre el punto de la estación y el punto medio del transecto
  distancia_max_estacion_a_punto_medio_m: 150

# Ancho total de la banda del transecto por clase (m). Se usa para calcular el área
# muestreada en base_limpia_larga.csv (área = largo × ancho) y así obtener densidades.
# Valores de la LdB de XPE: herpetozoos 200 × 5 m; aves y mamíferos 200 × 50 m
# (25 m a cada lado del eje).
ancho_transecto_m:
  Aves: 50
  Mamíferos: 50
  Reptiles: 5
  Anfibios: 5

coordenadas:
  # E07: coordenada a más de esta distancia de la mediana de las estaciones
  distancia_max_a_mediana_km: 5

captura:
  # R16: coordenada de captura a más de esta distancia de su estación
  distancia_max_m: 300

# R08: especies domésticas. Van en la planilla que se entrega (no se borran), pero la LdB de XPE
# no las considera en la lista de especies ni en los análisis. Con excluir_del_analisis: true
# salen con excluir_motivo = 'doméstica' en base_limpia_larga.csv. En la aplicación se puede
# cambiar por planilla.
domesticas:
  excluir_del_analisis: true
  nombres_cientificos:
    - Equus caballus
    - Equus asinus
    - Canis familiaris
    - Canis lupus familiaris
    - Felis catus
    - Felis silvestris catus
    - Bos taurus
    - Capra hircus
    - Ovis aries
    - Gallus gallus
    - Gallus gallus domesticus
    - Sus scrofa domesticus
    - Lama glama
    - Vicugna pacos
  nombres_comunes:
    - Caballo
    - Caballo feral
    - Perro
    - Perro asilvestrado
    - Gato
    - Gato doméstico
    - Vaca
    - Vaca feral
    - Cabra
    - Oveja
    - Burro
    - Mula
    - Gallina
    - Cerdo
    - Llama
    - Alpaca

# R25: especies exóticas (introducidas y asilvestradas). En la LdB de XPE entran en la lista de
# especies y en los análisis, marcadas como «Exótico»: quedan con origen = 'exótica' en
# base_limpia_larga.csv y, salvo excluir_del_analisis: true, dentro del análisis.
exoticas:
  excluir_del_analisis: false
  nombres_cientificos: [Oryctolagus cuniculus, Lepus europaeus, Rattus rattus, Rattus norvegicus, Mus musculus, Sus scrofa, Neogale vison, Neovison vison, Castor canadensis, Cervus elaphus, Columba livia, Passer domesticus, Callipepla californica]
  nombres_comunes: [Conejo, Conejo europeo, Liebre, Liebre europea, Rata negra, Guarén, Laucha doméstica, Ratón doméstico, Jabalí, Visón, Castor, Ciervo rojo, Paloma, Paloma doméstica, Gorrión, Codorniz, Codorniz de California]

aves:
  clase: Aves
  # R11 (solo indicador): % de registros de aves en transecto en este horario de baja actividad
  horario_baja_actividad: ["12:00", "17:00"]

abundancia:
  # R07: no marca conteos bajo este número
  min_atipica: 10
  # R07 no revisa las aves de estos órdenes, que andan en bandadas (30 chincoles es normal)
  ordenes_gregarios: [Passeriformes, Columbiformes, Psittaciformes, Anseriformes, Charadriiformes, Gruiformes, Pelecaniformes, Suliformes, Procellariiformes, Procellariformes, Sphenisciformes, Podicipediformes, Phoenicopteriformes, Cathartiformes, Galliformes, Rheiformes]

horarios:
  # R12: los playback (aves y anfibios) se hacen de noche; solo se marca uno hecho
  # claramente de día, fuera de este rango
  nocturno: ["18:00", "07:00"]
  metodologias_nocturnas: [Playback aves, Playback anfibios]
