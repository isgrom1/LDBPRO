name: Ejecutable para Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Pruebas (las que no necesitan una planilla real)
        run: python -m pytest -q

      - name: Construir AuditorXPE.exe
        run: pyinstaller --noconfirm --clean empaquetado/AuditorXPE.spec

      - name: Autoprueba del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\AuditorXPE.exe -ArgumentList "--autoprueba" -Wait -PassThru
          Get-Content "$env:TEMP\AuditorXPE_autoprueba.log"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Autoprueba de la ventana propia (WebView2)
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\AuditorXPE.exe -ArgumentList "--autoprueba-ventana" -Wait -PassThru
          Get-Content "$env:TEMP\AuditorXPE_autoprueba_ventana.log"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: AuditorXPE-windows
          path: dist/AuditorXPE.exe
          if-no-files-found: error
          retention-days: 90
